name: SmartBuy
description: "SmartBuy - E-Commerce Flutter Application"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6

  get_storage: ^2.1.1
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  http: ^1.2.0

  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0

  intl: ^0.19.0
  url_launcher: ^6.2.3
  image_picker: ^1.0.7
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  connectivity_plus: ^6.0.5

  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  email_validator: ^2.1.17
  file_picker: ^10.3.10
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.7
  persistent_bottom_nav_bar: ^6.2.1




  # Payment (for future integration)
  # stripe_payment: ^1.1.0
  # razorpay_flutter: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_native_splash:
    color: "#FFFFFF"
    android: true
    ios: true

flutter:


  uses-material-design: true


  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/


